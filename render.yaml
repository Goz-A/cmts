# Render Blueprint: backend API + managed PostgreSQL.
# The frontend is deployed separately to GitHub Pages (.github/workflows/deploy-frontend.yml).
databases:
  - name: cmts-db
    databaseName: cmts
    user: cmts
    plan: free            # check Render's current free-tier limits (free databases expire)

services:
  - type: web
    name: cmts-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cmts-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN        # set to the GitHub Pages origin, e.g. https://<user>.github.io
        sync: false
